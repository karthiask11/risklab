<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Risk Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE work: a money tool, calm and exact, like a central bank bulletin
   IDEA a risk desk's portfolio sheet: holdings on one side, the verdict drawn beside it
   PICTURE live risk-vs-return chart: each stock a dot, the portfolio a large ring
   COLOUR white ground, ink #14161a, deep teal #0b5d63 leads, red only for losses; night #0d1416
   TYPE Libre Caslon Text for titles and big figures + Inter for everything else
   LAYOUT laptop: editor left, result right; phone: title, result, editor, details */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0d1416);--ink:light-dark(#14161a,#e4ecec);--mute:light-dark(#5b6670,#93a4a8);--rule:light-dark(#dde3e5,#22343a);--soft:light-dark(#f2f6f6,#132026);--teal:light-dark(#0b5d63,#5cc0bc);--tealbg:light-dark(#e3f0ef,#123236);--red:light-dark(#b42318,#ff7b6e);--band:light-dark(#0b5d63,#0f2a2e)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,.big{font-family:"Libre Caslon Text",Georgia,serif;letter-spacing:-.02em;line-height:1.05;margin:0}
h1{font-size:clamp(28px,4vw,42px)}
h2{font-size:22px;margin-bottom:12px}
.top{background:var(--band);color:#fff;padding:20px max(5vw,16px) 16px}
.status{font-size:14px;color:#cfe5e3;margin:6px 0 14px}
.status b{color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs a{color:#fff;text-decoration:none;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:600;font-size:15px;white-space:nowrap}
.tabs a[aria-current]{background:#fff;color:#0b5d63}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.5);border-radius:999px;overflow:hidden}
.seg button{background:transparent;color:#fff;border:0;padding:0 13px;min-height:40px;font:600 14px Inter,sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:#0b5d63}
main{padding:22px max(5vw,16px) 48px;max-width:1340px;margin:0 auto}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;align-items:start}
.panel{border:1px solid var(--rule);border-radius:12px;padding:16px;background:var(--bg)}
.soft{background:var(--soft);border-color:transparent}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
th{font-weight:600;color:var(--mute);font-size:13px}
th:first-child,td:first-child{text-align:left}
td.n{font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
input{font:16px Inter,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;min-height:44px}
input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.btn{font:600 15px Inter,sans-serif;border-radius:8px;border:1px solid var(--teal);background:var(--teal);color:var(--bg);padding:0 16px;min-height:44px;cursor:pointer}
.btn.ghost{background:var(--bg);color:var(--teal)}
.pickbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:600 17px Inter,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;min-height:52px;cursor:pointer}
.pickbtn small{display:block;font:400 13px Inter,sans-serif;color:var(--mute)}
.pickbtn::after{content:"▾";color:var(--teal);font-size:18px}
.h{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.hh{display:flex;align-items:center;gap:8px}
.hh .nm{flex:1;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm{border:1px solid var(--rule);background:var(--bg);color:var(--red);font:600 14px Inter,sans-serif;border-radius:8px;min-height:40px;padding:0 12px;cursor:pointer}
.hf{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;margin-top:8px}
.hf label{display:grid;font-size:13px;color:var(--mute);gap:2px}
.hf input{width:104px;text-align:right}
.hf input[type=radio]{width:auto;min-height:auto}
.hf .kv{font-size:13px;color:var(--mute)}
.hf .kv b{display:block;font:600 15px Inter,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.warn{color:var(--red);font-size:13px;margin-top:6px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:14px;margin-bottom:14px}
.fig1 .lab{font-size:13px;color:var(--mute)}
.big{font-size:clamp(30px,4vw,44px);white-space:nowrap}
.mid{font:600 22px Inter,sans-serif;white-space:nowrap}
.pos{color:var(--teal)}.neg{color:var(--red)}
.note{font-size:13px;color:var(--mute);margin:8px 0 0}
.fig{position:relative;min-height:330px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
svg text{font:13px Inter,sans-serif;fill:var(--mute);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
svg .lbl{fill:var(--ink);font-weight:600}
.meter{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--teal)}
.steps td:first-child{white-space:normal}
details{margin-top:16px;border-top:1px solid var(--rule);padding-top:10px}
summary{cursor:pointer;font-weight:600;color:var(--teal);min-height:40px;display:flex;align-items:center}
.load{padding:28px 0;color:var(--mute)}
.err{color:var(--red);font-size:14px}
.banner{background:#fff3cd;color:#5c4400;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(16em,1fr));gap:16px}
.cards .panel h3{margin:0 0 6px;font-size:17px}
code{font-size:14px;background:var(--soft);padding:2px 5px;border-radius:4px;overflow-wrap:anywhere}
section+section{margin-top:28px}
input[type=range]{width:100%;accent-color:var(--teal);min-height:32px;padding:0;border:0}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,94vw);max-height:86vh;background:var(--bg);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.dh h2{margin:0;font-size:20px}
.x{border:0;background:transparent;color:var(--mute);font-size:26px;min-width:44px;min-height:44px;cursor:pointer}
#pq{margin:0 16px 8px;width:calc(100% - 32px)}
#plist{overflow-y:auto;max-height:calc(86vh - 130px);padding:0 8px 12px}
#plist button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--rule);padding:10px 8px;min-height:52px;color:var(--ink);font:15px Inter,sans-serif;cursor:pointer}
#plist button:hover{background:var(--soft)}
#plist b{display:block}
#plist span{color:var(--mute);font-size:13px}
#plist .px{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
#plist button[disabled]{opacity:.45}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22em),1fr));gap:20px;align-items:start}
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;align-items:center}
.hero h2{font-size:clamp(32px,4.4vw,50px);margin-bottom:14px}
.hero p{font-size:17px;max-width:46ch;margin:0 0 18px}
.strip{display:flex;flex-wrap:wrap;gap:8px 22px;margin:18px 0 0;font-size:14px;color:var(--mute)}
.strip b{color:var(--ink);font-size:18px;display:block}
.cards a{color:inherit;text-decoration:none}
.cards a .panel{height:100%}
.cards a:hover .panel{border-color:var(--teal)}
.cards .go{color:var(--teal);font-weight:600;font-size:14px}
.steps3{display:grid;grid-template-columns:repeat(auto-fit,minmax(14em,1fr));gap:16px;counter-reset:s}
.steps3 div{border-top:3px solid var(--teal);padding-top:10px}
.faq details{border-top:1px solid var(--rule);margin:0;padding:6px 0}
.faq p{margin:4px 0 10px;color:var(--mute)}
.score{display:flex;align-items:baseline;gap:10px}
.score .big{font-size:clamp(44px,6vw,64px)}
.bars div{display:grid;grid-template-columns:minmax(7em,11em) minmax(0,1fr) 3.2em;gap:10px;align-items:center;font-size:14px;margin:6px 0}
.bars .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tips{margin:10px 0 0;padding-left:20px;font-size:14px}
.tips li{margin:4px 0}
.ctl{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.ctl input,.ctl select{flex:1 1 11em}
select{font:16px Inter,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;min-height:44px}
.add{border:1px solid var(--teal);background:var(--bg);color:var(--teal);font:600 14px Inter,sans-serif;border-radius:8px;min-height:36px;padding:0 10px;cursor:pointer}
.add[disabled]{border-color:var(--rule);color:var(--mute)}
th.sort{cursor:pointer;color:var(--teal)}
#stab td:first-child{white-space:normal;max-width:10em}
@media(max-width:600px){#stab .add{padding:0 8px}#stab td:first-child{max-width:7.5em}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
footer{border-top:1px solid var(--rule);padding:18px max(5vw,16px);font-size:13px;color:var(--mute)}
@media(max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.hide-s{display:none}.bars div{grid-template-columns:minmax(6em,8em) minmax(0,1fr) 3em}}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.result{order:-1}}
@media(max-width:600px){table{font-size:13px}th,td{padding:6px 4px}.fig{min-height:270px}.tabs a{padding:8px 11px;font-size:14px}}
@media(prefers-reduced-motion:no-preference){.ring{transition:cx .4s,cy .4s}}
</style>
</head>
<body>
<header class="top">
  <h1>Portfolio Risk Lab</h1>
  <p class="status" id="status">Loading prices…</p>
  <div class="bar">
    <nav class="tabs" id="tabs">
      <a href="#home">Home</a><a href="#portfolio">Portfolio</a><a href="#pair">Two stocks</a><a href="#single">One stock</a><a href="#screen">Screener</a><a href="#learn">Formulas</a>
    </nav>
    <div class="seg" id="period" role="group" aria-label="Period">
      <button data-y="1" aria-pressed="true">1Y</button><button data-y="3" aria-pressed="false">3Y</button><button data-y="5" aria-pressed="false">5Y</button><button data-y="10" aria-pressed="false">10Y</button>
    </div>
  </div>
</header>
<main id="main"></main>
<footer>Portfolio Risk Lab · Free and for learning, not investment advice · Prices: NSE bhavcopy (latest close) and Yahoo Finance (history)</footer>
<div class="toast" id="toast" role="status"></div>

<dialog id="pick">
  <div class="dh"><h2 id="ptitle">Choose a stock</h2><button class="x" id="pclose" aria-label="Close">×</button></div>
  <input id="pq" type="search" placeholder="Search name or symbol" autocomplete="off">
  <div id="plist"></div>
</dialog>

<template id="t-home">
  <section class="hero">
    <div>
      <h2>Know the risk before you invest.</h2>
      <p>A free risk and return calculator for NSE stocks. Check your portfolio's health, mix two stocks, or screen the Nifty 500. Every number shows its formula.</p>
      <div class="row" style="display:flex;flex-wrap:wrap;gap:10px"><a class="btn" href="#portfolio" style="display:inline-flex;align-items:center;text-decoration:none">Check my portfolio</a><a class="btn ghost" href="#screen" style="display:inline-flex;align-items:center;text-decoration:none">Open the screener</a></div>
      <div class="strip" id="hstrip"></div>
    </div>
    <div class="panel">
      <h3 style="margin:0 0 4px;font-size:16px" id="htitle">Risk vs return</h3>
      <div class="fig" id="hfig" style="min-height:300px"><svg role="img" aria-label="Risk and return of every stock"></svg></div>
      <p class="note" id="hnote"></p>
    </div>
  </section>
  <section>
    <h2>What you can do</h2>
    <div class="cards">
      <a href="#portfolio"><div class="panel"><h3>Portfolio health score</h3><p>A 0–10 score for diversification, from your number of stocks, biggest holding, biggest sector and how alike your stocks move, with tips to improve it.</p><span class="go">Check my portfolio →</span></div></a>
      <a href="#portfolio"><div class="panel"><h3>Risk, return and sectors</h3><p>Your portfolio's yearly risk and return, how much risk mixing removes, each stock's share of risk, correlations and sector split.</p><span class="go">See my portfolio →</span></div></a>
      <a href="#pair"><div class="panel"><h3>Two-stock mixer</h3><p>Slide the weight between any two stocks and see the risk change, with the lowest-risk mix marked.</p><span class="go">Mix two stocks →</span></div></a>
      <a href="#single"><div class="panel"><h3>One-stock deep dive</h3><p>Price chart, CAGR, daily and yearly risk, best and worst day, and the biggest fall from a peak.</p><span class="go">Study a stock →</span></div></a>
      <a href="#screen"><div class="panel"><h3>Nifty 500 screener</h3><p>Filter by sector and sort by return, risk or return per unit of risk. Add any stock to your portfolio in one tap.</p><span class="go">Screen stocks →</span></div></a>
      <a href="#learn"><div class="panel"><h3>Formulas explained</h3><p>Variance, standard deviation, covariance, correlation and portfolio risk in plain words, the same way you would do them in Excel.</p><span class="go">Learn the maths →</span></div></a>
    </div>
  </section>
  <section>
    <h2>How it works</h2>
    <div class="steps3">
      <div><b>1. Prices update every evening</b><p class="note">After the market closes, NSE's official closing prices for the Nifty 500 are added to up to 10 years of split- and bonus-adjusted history.</p></div>
      <div><b>2. Add what you own</b><p class="note">Pick stocks from the list and enter quantity and buy price, or set weights. Your holdings stay in your own browser.</p></div>
      <div><b>3. Read the result</b><p class="note">Choose 1, 3, 5 or 10 years. Risk, return, health score and every step of the calculation update at once.</p></div>
    </div>
  </section>
  <section class="faq">
    <h2>Questions</h2>
    <details><summary>Where do the prices come from?</summary><p>The latest day's price is NSE's official closing price from the NSE bhavcopy (NSE's end-of-day price file). Older daily prices come from Yahoo Finance, adjusted for splits and bonus issues but not dividends. Prices update every weekday evening after NSE publishes its file.</p></details>
    <details><summary>What does "risk" mean here?</summary><p>Risk is the standard deviation of daily returns, turned into a yearly figure (daily SD × √252). It shows how much the return usually swings above or below its average.</p></details>
    <details><summary>Is this investment advice?</summary><p>No. It measures what happened in the past to help you learn and compare. Past risk and return do not predict the future.</p></details>
    <details><summary>Is my portfolio private?</summary><p>Yes. Your holdings are saved only in the browser you use and are never sent anywhere.</p></details>
    <details><summary>Does it cost anything?</summary><p>No. The whole site is free.</p></details>
  </section>
</template>

<template id="t-screen">
  <h2>Screener</h2>
  <div class="ctl">
    <input id="sq" type="search" placeholder="Search name or symbol" aria-label="Search">
    <select id="ssec" aria-label="Sector"></select>
    <select id="ssort" aria-label="Sort">
      <option value="rr">Best return per unit of risk</option>
      <option value="ar">Highest yearly return</option>
      <option value="lowk">Lowest risk</option>
      <option value="cagr">Highest CAGR</option>
      <option value="chg">Today's change</option>
    </select>
  </div>
  <p class="note" id="scount" style="margin:0 0 8px"></p>
  <div class="scroll"><table id="stab"></table></div>
  <p class="note">Return and risk are yearly figures for the chosen period (1Y, 3Y, 5Y or 10Y). Return per risk = yearly return ÷ yearly risk; higher is better. Stocks without enough history for the period are hidden.</p>
</template>

<template id="t-portfolio">
  <div class="grid">
    <section class="panel soft">
      <h2>My holdings</h2>
      <div class="hf" style="margin:0 0 12px">
        <label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="radio" name="mode" value="qty" style="min-height:auto"> By quantity</label>
        <label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="radio" name="mode" value="wt" style="min-height:auto"> By weight %</label>
      </div>
      <div id="hold"></div>
      <button class="btn" id="addBtn" type="button" style="width:100%">+ Add a stock</button>
      <p class="note" id="saved">Your holdings are saved in this browser.</p>
    </section>
    <section class="result"><div id="pres"></div></section>
  </div>
  <div id="pdetail"></div>
</template>

<template id="t-pair">
  <div class="grid">
    <section class="panel soft">
      <h2>Pick two stocks</h2>
      <div style="display:grid;gap:10px"><button class="pickbtn" id="pa"></button><button class="pickbtn" id="pb"></button></div>
      <p style="margin:16px 0 4px;font-size:14px" id="pwl"></p>
      <input type="range" id="pw" min="0" max="100" step="1" aria-label="Weight in the first stock">
      <div id="psteps"></div>
    </section>
    <section class="result"><div id="pairres"></div></section>
  </div>
</template>

<template id="t-single">
  <div class="grid">
    <section class="panel soft">
      <h2>Pick a stock</h2>
      <button class="pickbtn" id="ss"></button>
      <div id="sstats" style="margin-top:14px"></div>
    </section>
    <section class="result"><div id="sres"></div></section>
  </div>
</template>

<template id="t-learn">
  <h2>How each number is calculated</h2>
  <div class="cards">
    <div class="panel"><h3>Daily return</h3><p>R = today's close ÷ yesterday's close − 1. Prices are adjusted for splits and bonus issues, so a 1:1 bonus does not look like a −50% day.</p></div>
    <div class="panel"><h3>Average and risk (SD)</h3><p>Average = sum of R ÷ n. Variance = Σ(R − average)² ÷ (n − 1). Daily SD = √variance. This is Excel's <code>STDEV.S</code>.</p></div>
    <div class="panel"><h3>Annual figures</h3><p>Annual return = average daily return × 252. Annual risk = daily SD × √252. Risk grows with the square root of time.</p></div>
    <div class="panel"><h3>Price return and CAGR</h3><p>Price return = end price ÷ start price − 1. CAGR = (end ÷ start)^(1 ÷ years) − 1, the steady yearly rate.</p></div>
    <div class="panel"><h3>Covariance and correlation</h3><p>Covariance = Σ(RA − avgA)(RB − avgB) ÷ (n − 1). Correlation ρ = covariance ÷ (SD A × SD B), from −1 to +1. Low ρ means better diversification.</p></div>
    <div class="panel"><h3>Two-stock risk</h3><p>σp² = wA²σA² + wB²σB² + 2·wA·wB·ρ·σA·σB. Lowest-risk weight in A = (σB² − Cov) ÷ (σA² + σB² − 2·Cov).</p></div>
    <div class="panel"><h3>Many stocks</h3><p>Return = Σ wᵢ·Rᵢ. Variance = Σᵢ Σⱼ wᵢ·wⱼ·Covᵢⱼ: every pair of stocks adds a covariance term. Risk = √variance.</p></div>
    <div class="panel"><h3>Share of risk</h3><p>Share from stock i = wᵢ × Σⱼ wⱼ·Covᵢⱼ ÷ portfolio variance. Shares add up to 100%; a stock can add more risk than its weight.</p></div>
    <div class="panel"><h3>Weights</h3><p>By quantity: weight = quantity × latest price ÷ total value. By weight %: the numbers you type, scaled to add up to 100%.</p></div>
  </div>
  <p class="note" id="srcnote"></p>
</template>

  g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${a.Y(0)}" y2="${a.Y(0)}" stroke="var(--mute)"/>`;
  g+=`<text x="${W-m.r}" y="${H-6}" text-anchor="end">Risk (annual SD) →</text><text x="${m.l}" y="12">↑ Annual return</text>`;
  if(curve)g+=`<polyline fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-opacity=".45" points="${curve.map(p=>a.X(p.x)+","+a.Y(p.y)).join(" ")}"/>`;
  for(const p of pts){const X=a.X(p.x),Y=a.Y(p.y),left=X>W*.7;

    if(p.label)g+=`<text class="lbl" x="${left?X-14:X+14}" y="${Y+4}" text-anchor="${left?"end":"start"}">${esc(p.label)}</text>`}
  return g;
}
function lineChart(W,H,dates,p){
  const m={l:62,r:18,t:16,b:34},[y0,y1]=pad(Math.min(...p),Math.max(...p),.06),n=p.length-1;
  const X=i=>m.l+i/n*(W-m.l-m.r),Y=v=>H-m.b-(v-y0)/(y1-y0)*(H-m.t-m.b);
  let g="";const st=(y1-y0)/4;for(let k=0;k<=4;k++){const v=y0+st*k;g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${num(v,0)}</text>`}
  const nt=W<520?3:5;for(let k=0;k<nt;k++){const i=Math.round(k/(nt-1)*n);g+=`<text x="${X(i)}" y="${H-10}" text-anchor="${k===0?"start":k===nt-1?"end":"middle"}">${fmtD(dates[i]).slice(3)}</text>`}
  const pts=p.map((v,i)=>X(i)+","+Y(v)).join(" ");
  g+=`<polygon points="${m.l},${H-m.b} ${pts} ${X(n)},${H-m.b}" fill="var(--tealbg)"/><polyline points="${pts}" fill="none" stroke="var(--teal)" stroke-width="2"/>`;
  g+=`<circle cx="${X(n)}" cy="${Y(p[n])}" r="5" fill="var(--teal)"/><text class="lbl" x="${X(n)-8}" y="${Y(p[n])-10}" text-anchor="end">₹${num(p[n])}</text>`;
  return g;
}

let pairCache=null;
function renderPair(fast){
  const a=state.pairA,b=state.pairB,wa=state.pairW/100;
  $("#pwl").textContent=`Mix: ${state.pairW}% ${a} · ${100-state.pairW}% ${b}`;
  const go=(ok,bad)=>{
    if(ok.length<2){$("#pairres").innerHTML=errs(bad);$("#psteps").innerHTML="";return}
    const A=align([a,b],state.period),P=portfolio(A,[wa,1-wa]),[SA,SB]=P.S,c=P.C[0][1],rho=P.corr[0][1];
    pairCache={key:a+b+state.period};
    const wmin=Math.min(1,Math.max(0,(P.C[1][1]-c)/(P.C[0][0]+P.C[1][1]-2*c))),at=x=>portfolio(A,[x,1-x]),Pm=at(wmin),curve=[];
    for(let x=0;x<=1.0001;x+=.02){const z=at(x);curve.push({x:z.risk,y:z.ret})}
    $("#pairres").innerHTML=banner()+errs(bad)+`<div class="figs">
      <div class="fig1"><div class="lab">Mix risk a year</div><div class="big">${pct(P.risk,1)}</div></div>
      <div class="fig1"><div class="lab">Mix return a year</div><div class="big ${cls(P.ret)}">${pct(P.ret,1)}</div></div>
      <div class="fig1"><div class="lab">Correlation ρ</div><div class="mid">${rho.toFixed(2)}</div><div class="lab">${rho>.6?"move strongly together":rho>.3?"move moderately together":rho>-.1?"mostly independent":"tend to offset"}</div></div>
    </div><div class="panel"><div class="fig" id="pf"><svg role="img" aria-label="Risk and return for every mix of the two stocks"></svg></div>
    <p class="note">The curve is every mix from 100% ${esc(b)} to 100% ${esc(a)}. The ring is your mix; the hollow dot is the lowest-risk mix: ${pct(wmin,0)} ${esc(a)}, risk ${pct(Pm.risk,1)}.</p></div>`+shortNote(A);
    draw($("#pf"),(W,H)=>scatter(W,H,[{x:SA.ak,y:SA.ar,label:a},{x:SB.ak,y:SB.ar,label:b},{x:Pm.risk,y:Pm.ret,min:1,small:1},{x:P.risk,y:P.ret,label:"Your mix",main:1}],curve));
    $("#psteps").innerHTML=`<details><summary>See the step-by-step calculation</summary><div class="scroll"><table class="steps"><thead><tr><th>Step</th><th>${esc(a)}</th><th>${esc(b)}</th></tr></thead><tbody>
      <tr><td>Annual return</td><td class="n ${cls(SA.ar)}">${pct(SA.ar)}</td><td class="n ${cls(SB.ar)}">${pct(SB.ar)}</td></tr>
      <tr><td>Annual risk σ</td><td class="n">${pct(SA.ak)}</td><td class="n">${pct(SB.ak)}</td></tr>
      <tr><td>Daily variance</td><td class="n">${SA.v.toFixed(6)}</td><td class="n">${SB.v.toFixed(6)}</td></tr>
      <tr><td>Covariance (daily)</td><td class="n" colspan="2">${c.toFixed(6)}</td></tr>
      <tr><td>Term 1: wA² × σA²</td><td class="n" colspan="2">${(wa*wa*SA.ak*SA.ak).toFixed(4)}</td></tr>
      <tr><td>Term 2: wB² × σB²</td><td class="n" colspan="2">${((1-wa)**2*SB.ak*SB.ak).toFixed(4)}</td></tr>
      <tr><td>Term 3: 2·wA·wB·ρ·σA·σB</td><td class="n" colspan="2">${(2*wa*(1-wa)*rho*SA.ak*SB.ak).toFixed(4)}</td></tr>
      <tr><td><b>Risk = √(sum)</b></td><td class="n" colspan="2"><b>${pct(P.risk)}</b></td></tr>
      <tr><td>Risk cut by mixing</td><td class="n" colspan="2">${pct(P.wavg-P.risk)}</td></tr>
    </tbody></table></div></details>`;
  };
  if(fast&&pairCache&&pairCache.key===a+b+state.period&&store[a]&&store[b]){token++;go([a,b],[]);return}
  needs([a,b],$("#pairres"),go);
}

function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),1800)}
const sectorOf=s=>(STOCKS[s]&&STOCKS[s].ind)||"Other";
function healthHTML(use,w,P){
  const n=use.length,sec={};use.forEach((h,i)=>{const s=sectorOf(h.sym);sec[s]=(sec[s]||0)+w[i]});
  const secs=Object.entries(sec).sort((a,b)=>b[1]-a[1]),im=w.indexOf(Math.max(...w)),wmax=w[im],smax=secs[0][1];
  let cs=0,cw=0;for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){cs+=w[i]*w[j]*P.corr[i][j];cw+=w[i]*w[j]}
  const avgc=cw?cs/cw:1,lin=(x,good,bad)=>Math.max(0,Math.min(10,10*(bad-x)/(bad-good)));
  const parts=[
    ["Number of stocks",Math.min(10,n),`${n} stock${n>1?"s":""}. 10 or more gets full marks.`,"Add more stocks: 10 to 20 spread risk well."],
    ["Biggest holding",lin(wmax,.10,.60),`${use[im].sym} is ${pct(wmax,0)} of your money.`,`${use[im].sym} is ${pct(wmax,0)} of your portfolio. Try to keep one stock under 20%.`],
    ["Biggest sector",lin(smax,.25,.80),`${secs[0][0]} is ${pct(smax,0)}.`,`${secs[0][0]} is ${pct(smax,0)} of your portfolio. Add stocks from other sectors.`],
    ["How alike they move",n>1?lin(avgc,.1,.8):0,n>1?`Average correlation ${avgc.toFixed(2)}.`:"Needs two or more stocks.","Your stocks move together a lot. Add stocks with low correlation to the ones you hold."]];
  const sc=parts.reduce((a,p)=>a+p[1],0)/parts.length,verdict=sc>=7.5?"Well diversified":sc>=5?"Fairly diversified":"Needs more spread";
  const tips=parts.filter(p=>p[1]<6).map(p=>`<li>${esc(p[3])}</li>`).join("");
  return `<section style="margin-top:28px"><div class="grid2">
    <div class="panel"><h2>Portfolio health</h2><div class="score"><span class="big ${sc<5?"neg":"pos"}">${sc.toFixed(1)}</span><span class="mid">/ 10</span></div><p style="margin:2px 0 10px;font-weight:600">${verdict}</p>
      <div class="bars">${parts.map(p=>`<div><span>${esc(p[0])}</span><span class="meter"><i style="width:${p[1]*10}%;${p[1]<5?"background:var(--red)":""}"></i></span><span class="v">${p[1].toFixed(1)}</span></div>`).join("")}</div>
      <p class="note">${parts.map(p=>esc(p[2])).join(" ")}</p>${tips?`<ul class="tips">${tips}</ul>`:`<p class="note">No warnings. Your mix is well spread.</p>`}
      <p class="note">Score = average of the four parts. Each part is 10 when you are well spread and 0 when everything is in one place.</p></div>
    <div class="panel"><h2>Sectors</h2><div class="bars">${secs.map(([s,v])=>`<div><span>${esc(s)}</span><span class="meter"><i style="width:${v*100}%"></i></span><span class="v">${pct(v,0)}</span></div>`).join("")}</div>
      <p class="note">Share of your money in each sector${state.mode==="qty"?", at the latest prices":""}.</p></div>
  </div></section>`;
}
function metric(x,y){const m=x.m&&x.m[String(y)];return m?{ar:m[0],ak:m[1],pr:m[2],cagr:m[3],rr:m[1]>0?m[0]/m[1]:NaN}:null}
function viewHome(){
  const ups=LIST.filter(x=>x.chg>0).length,downs=LIST.filter(x=>x.chg<0).length,last=LIST.map(x=>x.date).sort().at(-1);
  $("#hstrip").innerHTML=`<span><b>${LIST.length}</b>NSE stocks</span><span><b>${esc(fmtD(last))}</b>latest prices</span><span><b><span class="pos">${ups}</span> / <span class="neg">${downs}</span></b>up / down that day</span>`;
  const y=state.period,pts=LIST.map(x=>({x,m:metric(x,y)})).filter(p=>p.m&&Number.isFinite(p.m.ak));
  $("#htitle").textContent=`${sample?"Sample stocks":"Nifty 500"}: risk vs return, last ${y} year${y>1?"s":""}`;
  if(!pts.length){$("#hfig").innerHTML=`<p class="load">No data for this period yet.</p>`;return}
  const lim=(a,q)=>{const s=a.slice().sort((p,r)=>p-r);return s[Math.min(s.length-1,Math.floor(q*(s.length-1)))]};
  const xs=pts.map(p=>p.m.ak),ys=pts.map(p=>p.m.ar),xmax=lim(xs,.98),ymin=lim(ys,.01),ymax=lim(ys,.99);
  const shown=pts.filter(p=>p.m.ak<=xmax&&p.m.ar>=ymin&&p.m.ar<=ymax);
  const best=shown.slice().sort((a,b)=>b.m.rr-a.m.rr)[0],big=shown.slice().sort((a,b)=>b.m.ar-a.m.ar)[0];
  const med=a=>{const s=a.slice().sort((p,r)=>p-r);return s[Math.floor(s.length/2)]};
  $("#hnote").textContent=`Each dot is a stock. Middle stock: risk ${pct(med(xs),0)}, return ${pct(med(ys),0)} a year.${pts.length>shown.length?" A few extreme stocks are left off so the rest are readable.":""}`;
  draw($("#hfig"),(W,H)=>scatter(W,H,shown.map(p=>({x:p.m.ak,y:p.m.ar,small:1,label:(p===best||p===big)?p.x.sym:""}))));
}
let scrSort="rr";
function viewScreen(){
  const secs=[...new Set(LIST.map(x=>x.ind||"Other"))].sort();
  $("#ssec").innerHTML=`<option value="">All sectors</option>`+secs.map(s=>`<option>${esc(s)}</option>`).join("");
  $("#ssort").value=scrSort;
  ["#sq","#ssec","#ssort"].forEach(id=>$(id).addEventListener("input",drawScreen));
  $("#stab").addEventListener("click",ev=>{const b=ev.target.closest("[data-add]");if(!b)return;const s=b.dataset.add;
    if(!state.holdings.some(h=>h.sym===s)){state.holdings.push({sym:s,qty:10,buy:0,wt:10});save()}b.disabled=true;b.textContent="Added";toast(s+" added to your portfolio")});
  drawScreen();
}
function drawScreen(){
  const q=$("#sq").value.trim().toLowerCase(),sec=$("#ssec").value,y=state.period;scrSort=$("#ssort").value;
  let rows=LIST.map(x=>({x,m:metric(x,y)})).filter(r=>r.m&&(!sec||(r.x.ind||"Other")===sec)&&(!q||r.x.sym.toLowerCase().includes(q)||r.x.name.toLowerCase().includes(q)));
  const key={rr:r=>-r.m.rr,ar:r=>-r.m.ar,lowk:r=>r.m.ak,cagr:r=>-r.m.cagr,chg:r=>-(r.x.chg||0)}[scrSort];
  rows.sort((a,b)=>key(a)-key(b));
  const held=new Set(state.holdings.map(h=>h.sym));
  $("#scount").textContent=`${rows.length} stock${rows.length===1?"":"s"} · period ${y} year${y>1?"s":""}`;
  $("#stab").innerHTML=`<thead><tr><th>Stock</th><th class="hide-s">Sector</th><th class="hide-s">Last ₹</th><th class="hide-s">Today</th><th>Return</th><th>Risk</th><th>Ret / risk</th><th></th></tr></thead><tbody>${
    rows.slice(0,300).map(({x,m})=>`<tr><td><b>${esc(x.sym)}</b><br><span class="note" style="margin:0">${esc(x.name.length>20?x.name.slice(0,19)+"…":x.name)}</span></td><td class="hide-s">${esc(x.ind||"Other")}</td><td class="n hide-s">${num(x.last)}</td><td class="n hide-s ${cls(x.chg||0)}">${pct(x.chg,1)}</td><td class="n ${cls(m.ar)}">${pct(m.ar,1)}</td><td class="n">${pct(m.ak,1)}</td><td class="n">${Number.isFinite(m.rr)?m.rr.toFixed(2):"–"}</td><td><button class="add" data-add="${esc(x.sym)}" ${held.has(x.sym)?"disabled>Added":">+ Add"}</button></td></tr>`).join("")}</tbody>`;
  if(rows.length>300)$("#stab").insertAdjacentHTML("beforeend",`<tbody><tr><td colspan="8" class="note">Showing the first 300. Search or pick a sector to narrow the list.</td></tr></tbody>`);
}
const views={home:["t-home",viewHome],screen:["t-screen",viewScreen],portfolio:["t-portfolio",viewPortfolio],pair:["t-pair",viewPair],single:["t-single",viewSingle],learn:["t-learn",viewLearn]};
function route(){
  const h=location.hash.slice(1),tab=views[h]?h:"home";
  document.querySelectorAll("#tabs a").forEach(a=>a.toggleAttribute("aria-current",a.getAttribute("href")==="#"+tab));
  const [tid,fn]=views[tab];$("#main").replaceChildren($("#"+tid).content.cloneNode(true));token++;fn();
}
function setPeriod(y){state.period=y;document.querySelectorAll("#period button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.y===y)))}
document.querySelectorAll("#period button").forEach(b=>b.onclick=()=>{setPeriod(+b.dataset.y);save();route()});
window.addEventListener("hashchange",route);
try{const d=JSON.parse(localStorage.getItem("rrlab:state"));if(d&&Array.isArray(d.holdings)){Object.assign(state,d);setPeriod(+state.period||1)}}catch(e){}
boot();
}
</script>
</body>
